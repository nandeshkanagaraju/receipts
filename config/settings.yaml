# Runtime settings. SDD §26. Loaded with extra="forbid" and strict=True: an
# unknown key or a wrong type raises at startup.
# Secrets are NEVER here. DSNs and API keys come from the environment.

# D2: the world's "today" is injected, never read from a clock.
as_of: 2026-09-10

paths:
  data_dir: data
  duckdb: data/kestrel.duckdb
  gateway_sqlite: data/gateway.sqlite
  manifest: data/MANIFEST.json
  semantic_dir: semantic
  prompts_dir: prompts
  recordings_dir: eval/recordings
  results_dir: eval/results

adapters:
  duckdb:
    read_only: true
    enable_external_access: false
  postgres:
    dsn_env: RECEIPTS_POSTGRES_DSN
    statement_timeout_ms: 15000
    application_name: receipts_ro

llm:
  mode: replay                 # live | record | replay
  # null, not 0. The gpt-5 family accepts only its default temperature and
  # returns a 400 for any explicit value, so the client omits the parameter.
  # Run-to-run reproducibility comes from record/replay instead (ADR-018).
  temperature: null
  # OpenAI on BOTH sides (ADR-018). The thesis compares architectures, not
  # models, so the baseline and Receipts must use the same one. A dated
  # snapshot, never a floating alias: if the alias moved between the baseline
  # recording and Receipts' own, the comparison would silently be across two
  # models.
  primary:   {provider: openai, model: gpt-5.5-2026-04-23}
  # PDD J7 (provider outage) needs a second opinion to exist. A different model,
  # and a dated snapshot for the same reason the primary is one: an alias that
  # moves is a different experiment with the same name.
  #
  # The tension with "same model on both sides" is real and is handled by making
  # the fallback *visible* rather than by removing it: `FallbackLLM` counts
  # secondary calls, the harness records the count in the report's provenance,
  # and a measurement run that touched the secondary says so on its face instead
  # of hiding a row produced by a different model among rows that were not.
  secondary: {provider: openai, model: gpt-5.4-2026-03-05}
  max_tokens:
    intent: 512
    planner: 2048
    repair: 1024
    composer: 1024
    baseline: 4096
  budget_per_question:
    tokens_in: 12000
    tokens_out: 2000
  # B0 only. Its prompt is the full DDL plus the whole glossary plus ten worked
  # examples (~16k tokens), and the single retry re-sends the conversation.
  baseline_budget_per_question:
    tokens_in: 40000
    tokens_out: 8192

freeform:
  enabled: true

row_limit: 500
timeout_s: 30.0

why:
  min_rel_change: "0.02"
  min_z: "2.0"
  concentration: "0.4"
  max_levels: 6
  query_budget: 40
  trailing_periods: 28          # upper bound on the trailing baseline
  min_trailing_periods: 8       # below this, refuse to judge (ADR-010)
  dimensions: [country, region, city, showroom, payment_method, issuing_bank, card_network, model, channel]

routing:
  prefer_oltp_recent: false
  postgres_window_days: 90

cache:
  path: data/cache.sqlite
  plan_cache_enabled: true
  result_cache_enabled: true

bridge:
  base_url_env: RECEIPTS_GATEWAY_URL
  token_env: RECEIPTS_GATEWAY_TOKEN
  timeout_s: 10.0
  max_pages: 20

demo:
  enabled: true
  questions_per_minute: 20
  daily_spend_cap_micro_usd: 5000000

testing:
  # SDD §27: the whole suite has a wall-clock ceiling, printed every run.
  suite_ceiling_seconds: 480
