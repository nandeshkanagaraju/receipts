# Trilingual aliases for values the data holds. SDD §9.1 rule 3.
#
# PROVENANCE, stated plainly because the rule about where a synonym came from is
# the whole difference between a synonym and a guess:
#
#   * Every canonical key below is a value that EXISTS in the warehouse's value
#     index. Nothing here invents a place, a method, or a bank.
#   * The Tamil and Devanagari forms are the ordinary written names for those
#     same entities. The warehouse has no localised name column and the glossary
#     defines metrics rather than naming places, so this layer is written down
#     rather than derived -- which is exactly why it is in a reviewable file and
#     not in code.
#   * English aliases are either the business's own word for the thing (the
#     warehouse table is called `showrooms`, so "showroom" resolves to the
#     `in_store` channel), a widely used former name (Madras, Bangalore), or an
#     ISO code already present in `countries.country_code`.
#   * NOTHING here was read from eval/questions. Each dimension covers EVERY
#     value the data holds for it, not the values that happened to fail -- the
#     failing set was Chennai, Tamil Nadu and India, and a file containing only
#     those three would be eval-tuning in a data file's clothes.
#     `test_curated_synonyms_cover_every_value` enforces the coverage.
#
# NOT COVERED, deliberately: showroom (263 values) and model (46) are compound
# proper nouns built from a brand word plus a place or a series name ("Kestrel
# Adyar", "Kestrel Lark 3"); they are written the same way in every language in
# this corpus. emi_tenure_months is numeric. The coverage test knows this list.

