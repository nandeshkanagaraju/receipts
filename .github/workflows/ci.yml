# SDD §28. Jobs added as their modules land; every job prints its duration.
# Remaining jobs (data, eval-dev, semantic, web, images) arrive with M2+.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: start
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: Duration
        if: always()
        run: echo "lint took $(( $(date +%s) - ${{ steps.start.outputs.t }} ))s"

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: start
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: mypy
        run: mypy
      - name: Duration
        if: always()
        run: echo "types took $(( $(date +%s) - ${{ steps.start.outputs.t }} ))s"

  test:
    runs-on: ubuntu-latest
    # The artifact tests fail rather than skip when data/ is missing -- which is
    # correct, and is why this dependency has to exist.
    needs: data
    steps:
      # Tags, not just the tip: freeze_questions.tag_exists() reads them, and a
      # guard that stops guarding because the clone is shallow is not a guard.
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0
      - id: start
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Download the world
        uses: actions/download-artifact@v4
        with:
          name: world
      - name: Artifact present
        run: du -sh data truth && ls -la data
      - name: The sealed marker arrived, and nothing else did
        # The sealed gate cannot run here: this job has no seed and no sealed
        # files, and must not have either. What it has is the counts-only line
        # the data job wrote, which the standing gen-frozen check requires.
        run: |
          cat _ci/sealed_gate.txt
          if [ -e eval/sealed/holdout_why.jsonl ] || [ -e eval/sealed/holdout_anomalies.json ]; then
            echo "sealed questions reached the test job; they must never travel" >&2
            exit 1
          fi
      - name: pytest (socket guard active, zero network calls)
        run: pytest
      - name: Duration
        if: always()
        run: echo "test took $(( $(date +%s) - ${{ steps.start.outputs.t }} ))s"

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: start
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Seed is visible to the job
        env:
          KESTREL_SEALED_SEED: ${{ secrets.KESTREL_SEALED_SEED }}
        run: |
          # Never echo the value. Presence only.
          if [ -n "$KESTREL_SEALED_SEED" ]; then echo "seed present: yes"; \
          else echo "seed present: no"; exit 1; fi
      - name: Cache the generated world
        id: worldcache
        uses: actions/cache@v4
        with:
          path: |
            data
            truth
            _ci
          # _ci holds one counts-only line proving the sealed gate ran. It is
          # cached with the world because a cache hit skips generation, and a
          # skipped generation would otherwise leave the test job with no proof.
          # eval/sealed/ is NOT here and must never be: this repository is
          # public, caches are restorable from pull-request workflows, and the
          # sealed files are the answers to the blind set.
          #
          # The generator source decides the data, so its hash is the key. The
          # seed is deliberately not in the key: it must never appear anywhere
          # a cache entry name can be read.
          # -v2: the cached world predates the sealed marker. Without a new key the
          # cache would hit, generation would be skipped, and the marker step with
          # it -- leaving the test job with no proof and a red run.
          key: world-${{ hashFiles('kestrel_gen/**/*.py') }}-scale055-v2
      - name: Build the world
        if: steps.worldcache.outputs.cache-hit != 'true'
        env:
          KESTREL_SEALED_SEED: ${{ secrets.KESTREL_SEALED_SEED }}
        run: make data
      - name: Sealed gate (counts only)
        if: steps.worldcache.outputs.cache-hit != 'true'
        env:
          KESTREL_SEALED_SEED: ${{ secrets.KESTREL_SEALED_SEED }}
        # This is the only job that can run the sealed gate: it holds the seed and
        # has just generated eval/sealed/. It writes one line -- "sealed WHY: N of
        # N pass" -- and that line is all that leaves the job.
        run: python -c "import sys; sys.path.insert(0, 'scripts'); import freeze_gen; print(freeze_gen.write_marker())"
      - name: The marker exists and reads N of N
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import freeze_gen, pathlib; \
            p = pathlib.Path(freeze_gen.SEALED_MARKER); \
            sys.exit('marker missing: ' + freeze_gen.SEALED_MARKER) if not p.exists() else None; \
            line = p.read_text().strip(); print(line); \
            sys.exit('marker is not ' + freeze_gen.expected_marker()) if line != freeze_gen.expected_marker() else None"
      - name: Nothing sealed leaves this job
        # Belt and braces around the cache and artifact paths above. If a sealed
        # file ever appears under a path that travels, this fails here rather
        # than in a public artifact.
        run: |
          # Match the sealed *questions*, not the substring "sealed": the first
          # version of this matched _ci/sealed_gate.txt -- the counts-only marker
          # that exists precisely so nothing sealed has to travel -- and failed
          # the job over its own safe proxy.
          found=$(find data truth _ci \( -name 'holdout_*' -o -path '*eval/sealed*' \) -print)
          if [ -n "$found" ]; then
            echo "a sealed file is inside a path that leaves this job" >&2
            echo "$found" >&2
            exit 1
          fi
          # The marker is one line and says only how many cleared.
          lines=$(wc -l < _ci/sealed_gate.txt)
          if [ "$lines" -ne 1 ]; then
            echo "the marker is $lines lines; it must be exactly one" >&2
            exit 1
          fi
          grep -Eq '^sealed WHY: [0-9]+ of [0-9]+ pass$' _ci/sealed_gate.txt || {
            echo "the marker is not a bare count line" >&2; exit 1; }
          echo "no sealed content in data/, truth/ or _ci/; marker is one count line"
      - name: Artifact size
        run: du -sh data truth
      - name: Upload the world for the test job
        uses: actions/upload-artifact@v4
        with:
          name: world
          path: |
            data
            truth
            _ci
          retention-days: 1
          compression-level: 1
      - name: Duration
        if: always()
        run: echo "data took $(( $(date +%s) - ${{ steps.start.outputs.t }} ))s"

  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: start
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Frozen document hashes match FREEZE_MANIFEST.json
        run: python scripts/freeze.py --check
      - name: Duration
        if: always()
        run: echo "freeze took $(( $(date +%s) - ${{ steps.start.outputs.t }} ))s"
