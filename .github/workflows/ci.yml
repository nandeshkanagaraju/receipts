# SDD §28. Jobs added as their modules land; every job prints its duration.
# Remaining jobs (data, eval-dev, semantic, web, images) arrive with M2+.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: start
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: Duration
        if: always()
        run: echo "lint took $(( $(date +%s) - ${{ steps.start.outputs.t }} ))s"

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: start
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: mypy
        run: mypy
      - name: Duration
        if: always()
        run: echo "types took $(( $(date +%s) - ${{ steps.start.outputs.t }} ))s"

  test:
    runs-on: ubuntu-latest
    # The artifact tests fail rather than skip when data/ is missing -- which is
    # correct, and is why this dependency has to exist.
    needs: data
    steps:
      # Tags, not just the tip: freeze_questions.tag_exists() reads them, and a
      # guard that stops guarding because the clone is shallow is not a guard.
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0
      - id: start
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Download the world
        uses: actions/download-artifact@v4
        with:
          name: world
      - name: Artifact present
        run: du -sh data truth && ls -la data
      - name: pytest (socket guard active, zero network calls)
        run: pytest
      - name: Duration
        if: always()
        run: echo "test took $(( $(date +%s) - ${{ steps.start.outputs.t }} ))s"

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: start
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Seed is visible to the job
        env:
          KESTREL_SEALED_SEED: ${{ secrets.KESTREL_SEALED_SEED }}
        run: |
          # Never echo the value. Presence only.
          if [ -n "$KESTREL_SEALED_SEED" ]; then echo "seed present: yes"; \
          else echo "seed present: no"; exit 1; fi
      - name: Cache the generated world
        id: worldcache
        uses: actions/cache@v4
        with:
          path: |
            data
            truth
          # The generator source decides the data, so its hash is the key. The
          # seed is deliberately not in the key: it must never appear anywhere
          # a cache entry name can be read.
          key: world-${{ hashFiles('kestrel_gen/**/*.py') }}-scale055
      - name: Build the world
        if: steps.worldcache.outputs.cache-hit != 'true'
        env:
          KESTREL_SEALED_SEED: ${{ secrets.KESTREL_SEALED_SEED }}
        run: make data
      - name: Artifact size
        run: du -sh data truth
      - name: Upload the world for the test job
        uses: actions/upload-artifact@v4
        with:
          name: world
          path: |
            data
            truth
          retention-days: 1
          compression-level: 1
      - name: Duration
        if: always()
        run: echo "data took $(( $(date +%s) - ${{ steps.start.outputs.t }} ))s"

  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: start
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Frozen document hashes match FREEZE_MANIFEST.json
        run: python scripts/freeze.py --check
      - name: Duration
        if: always()
        run: echo "freeze took $(( $(date +%s) - ${{ steps.start.outputs.t }} ))s"
